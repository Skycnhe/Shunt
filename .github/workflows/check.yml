# 每次推送 / PR：server.py / index.html 必须与 shunt/、web/ 一致，单元测试，并做 Python、面板脚本、shell 语法检查和部署清单检查
name: Check

on:
  push:
    branches: [Hk001]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: server.py、index.html 与源码一致
        run: python3 tools/build.py --check
      - name: Python 语法与未定义名字
        run: |
          python3 -m py_compile server.py tools/build.py shunt/*.py
          pip install -q pyflakes && python3 -m pyflakes shunt/ tools/ tests/
      - name: 单元测试
        run: python3 -m unittest discover -s tests -t . -v
      - name: 面板脚本语法
        run: |
          python3 - <<'PY'
          import re
          s = open("index.html", encoding="utf-8").read()
          open("/tmp/panel.js", "w").write("\n".join(re.findall(r"<script>([\s\S]*?)</script>", s)))
          PY
          node --check /tmp/panel.js
      - name: shell 语法
        run: for f in install.sh offline.sh tproxy.sh selftest.sh init.d/* .github/offline/build.sh docker/entrypoint.sh; do sh -n "$f" || exit 1; done
      - name: 部署清单里的文件都存在
        run: grep -v '^\s*#' update-files.txt | sed '/^\s*$/d' | while read -r f; do [ -f "$f" ] || { echo "缺少 $f"; exit 1; }; done
      - name: 能导入并生成配置
        run: |
          mkdir -p /tmp/p && echo '{}' > /tmp/p/data.json
          PANEL_OFFLINE=1 PANEL_DATA=/tmp/p/data.json MIHOMO_DIR=/tmp/p python3 -c "import server; d = server.load(); server.build_config(d); server.build_singbox(d); print('ok', server.PANEL_VERSION)"
